[project]
name = "trendbot"
version = "0.1.0"
description = "Trend-following trading bot for BTC and ETH: backtest, paper trade, then live on Kraken (CAD)"
readme = "README.md"
authors = [
    { name = "Neel Kakadiya", email = "neelkakadiya422@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "azure-identity>=1.26.0",
    "azure-storage-blob>=12.31.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
]

[project.scripts]
trendbot = "trendbot.cli:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
